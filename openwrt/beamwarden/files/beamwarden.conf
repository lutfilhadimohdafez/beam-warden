# beamwarden config - sourced by /usr/bin/beamwarden (plain shell, ponytail: no UCI yet)
AP_IF=wlan0          # AP interface to watch (find yours with `iw dev`; e.g. phy1-ap0)
MAC=                 # client MAC to protect; empty = aggregate all clients
WIN=2                # seconds per detection window
CAL_SECONDS=120      # how long `beamwarden calibrate` learns this network's normal
RETRY_MULT=1.5       # alert when retry_rate exceeds baseline * this
PER_MULT=1.5         # alert when tx-PER exceeds baseline * this
RETRY_FLOOR=0.30     # safety net: never alert below this absolute retry_rate
PER_FLOOR=0.15       # (guards a near-zero baseline on a pristine link)
HITS_TO_ALARM=3      # consecutive bad windows before alerting (noise guard)

# --- Telegram alerts (on_alert hook) --- get a token from @BotFather; empty = off
TELEGRAM_BOT_TOKEN=  # e.g. 123456:ABC-DEF... (keep secret)
TELEGRAM_CHAT_ID=    # your chat/channel id (message the bot, then getUpdates)
TELEGRAM_COOLDOWN=60 # min seconds between alerts so a sustained attack won't spam
