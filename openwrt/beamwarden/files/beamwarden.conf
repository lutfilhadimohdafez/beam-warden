# beamwarden config - sourced by /usr/bin/beamwarden (plain shell, ponytail: no UCI yet)
AP_IF=wlan0          # AP radio interface to tap (the 5GHz BSS under attack)
MON=bwmon0           # monitor vif beamwarden creates on AP_IF
MAC=                 # client MAC to protect; empty = watch any client
WIN=2                # detection window seconds (matches the trained pipeline)
CAL_SECONDS=120      # how long 'beamwarden calibrate' learns normal traffic
MARGIN=40            # alert ceiling = learned normal peak * (100+MARGIN)%
RATIO_PCT=25         # retry-ratio alert threshold in percent (normal ~0, attack ~50)
DEFAULT_CEIL=24      # fallback ceiling if you never calibrate (lab value)
